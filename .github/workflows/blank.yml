name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Extract ZIP and Build APK
        run: |
          unzip -q -o "*.zip" -d extracted_project
          PROJECT_DIR=$(dirname $(find extracted_project -name "settings.gradle*" | head -n 1))
          cd "$PROJECT_DIR"
          chmod +x gradlew || gradle wrapper
          ./gradlew wrapper --gradle-version 7.5
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IT-Education-App-APK
          path: "**/*.apk"
