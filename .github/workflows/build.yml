name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Project and Find APK
        run: |
          # فك ضغط أي ملفات مضغوطة
          for f in *.zip; do [ -f "$f" ] && unzip -q -o "$f" -d extracted_files; done
          
          # البحث عن أول مجلد مشروع وبنائه بالطريقة القياسية
          GRADLE_DIR=$(dirname $(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1))
          if [ "$GRADLE_DIR" != "." ]; then
            cd "$GRADLE_DIR"
            chmod +x gradlew || gradle wrapper
            ./gradlew assembleDebug || ./gradlew assembleRelease || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IT-Education-App-APK
          path: |
            **/*.apk
            !**/build/intermediates/**
            !**/build/outputs/apk/androidTest/**
