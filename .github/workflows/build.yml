name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          # فك ضغط أي ملفات مضغوطة إن وجدت
          for f in *.zip; do [ -f "$f" ] && unzip -q -o "$f" -d extracted_files; done
          
          # العثور على المجلد الذي يحتوي على ملف بناء الأندرويد والانتقال إليه بدقة
          GRADLE_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Error: build.gradle not found!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Entering project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # إعطاء الصلاحيات وبناء التطبيق
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IT-Education-App-APK
          path: "**/*.apk"
