name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK Forcefully
        run: |
          # فك ضغط الملفات إن وجدت
          for f in *.zip; do [ -f "$f" ] && unzip -q -o "$f" -d extracted_files; done
          
          # البحث عن ملف البناء والدخول للمسار
          GRADLE_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Error: build.gradle not found!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"
          
          # إعطاء الصلاحيات وبناء التطبيق مع تجاوز الأخطاء
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleDebug --continue || ./gradlew packageDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IT-Education-App-APK
          path: "**/*.apk"
