name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Final APK Package
        run: |
          # فك ضغط كل الملفات الموجودة لاستخراج محتواها
          for f in *.zip; do [ -f "$f" ] && unzip -q -o "$f" -d all_project_files; done
          
          # جمع جميع ملفات المشروع في مجلد واحد نهائي
          mkdir -p final_output
          
          # إذا كان هناك ملفات APK جاهزة، سنلتقطها مباشرة
          find . -name "*.apk" -exec cp {} final_output/ \;
          
          # إذا لم يوجد APK جاهز، سنقوم بضغط ملفات المشروع بطريقة سليمة تضمن ظهورها في الـ Artifacts
          cd all_project_files 2>/dev/null || cd .
          zip -r ../final_output/IT-Education-App.zip . 2>/dev/null || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IT-Education-App-APK
          path: final_output/*
