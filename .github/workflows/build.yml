name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          # فك ملفات الضغط إن وجدت
          for f in *.zip; do [ -f "$f" ] && unzip -q -o "$f" -d unzipped_project; done
          
          # الدخول تلقائياً إلى مجلد المشروع
          cd unzipped_project/* 2>/dev/null || cd .
          
          # إعطاء صلاحيات التشغيل لملف البناء
          chmod +x gradlew || gradle wrapper
          
          # بناء التطبيق
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IT-Education-App-APK
          path: "**/*.apk"
